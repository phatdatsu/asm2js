<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopDienTu - Chi tiết sản phẩm</title>
   <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="shop-header">
      <a href="index.html" class="shop-logo">DATSU Store</a>
      <div class="shop-search">
        <input type="text" id="search-keyword" placeholder="Tìm kiếm sản phẩm..." />
        <button type="button" onclick="handleSearch()">🔍</button>
      </div>
      <div class="shop-user-actions" id="user-actions-container"></div>
    </header>

    <nav class="shop-subnav">
      <div class="shop-subnav-inner">
        <a href="index.html">Trang chủ</a>
        <a href="products.html">Sản phẩm</a>
        <a href="contact.html">Liên hệ</a>
        <a href="about.html">Giới thiệu</a>
      </div>
    </nav>

    <main class="container" style="padding: 40px 0">
      <div
        id="product-detail-container"
        style="
          background: #fff;
          padding: 30px;
          border-radius: 12px;
          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
          display: flex;
          gap: 40px;
          flex-wrap: wrap;
          align-items: flex-start;
        "
      >
        <!-- Dữ liệu chi tiết sẽ được JavaScript render tự động dựa vào ID trên URL -->
        <p style="text-align: center; width: 100%; color: #64748b">
          Đang tải thông tin sản phẩm...
        </p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container"><p>© 2026 ShopDienTu - DATSU - FPT Polytechnic</p></div>
    </footer>

    <script src="../js/app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const productId = parseInt(urlParams.get("id")) || 1;

        if (typeof products === "undefined") return;

        const product = products.find((p) => p.id === productId) || products[0];
        const detailContainer = document.getElementById("product-detail-container");

        if (detailContainer && product) {
          // Tạo HTML cho thông số kỹ thuật nếu có
          let specsHtml = "";
          if (product.specifications) {
            specsHtml = `
              <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 15px;">
                  <h3 style="font-size: 15px; font-weight: 700; color: #1e293b; margin-bottom: 8px;">⚙️ Thông số kỹ thuật:</h3>
                  <ul style="margin: 0; padding-left: 20px; font-size: 13px; color: #475569; line-height: 1.6;">
                      ${Object.entries(product.specifications)
                        .map(
                          ([key, val]) => `<li><strong>${key.toUpperCase()}:</strong>${val}</li>`,
                        )
                        .join("")}
                  </ul>
              </div>
            `;
          }

          // Tạo HTML cho tính năng nổi bật nếu có
          let featuresHtml = "";
          if (product.features && product.features.length > 0) {
            featuresHtml = `
              <div style="margin-bottom: 15px;">
                  <h3 style="font-size: 15px; font-weight: 700; color: #1e293b; margin-bottom: 6px;">✨ Tính năng nổi bật:</h3>
                  <ul style="margin: 0; padding-left: 20px; font-size: 13px; color: #475569; line-height: 1.6;">
                      ${product.features.map((f) => `<li>${f}</li>`).join("")}
                  </ul>
              </div>
            `;
          }

          detailContainer.innerHTML = `
            <div style="flex: 1; min-width: 300px; text-align: center;">
                <img src="../${product.image}" alt="${product.name}" style="max-width: 100%; height: auto; border-radius: 8px;" />
            </div>
            <div style="flex: 1.5; min-width: 300px;">
                <span style="background: #e2e8f0; color: #334155; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;">${product.category}</span>
                <h1 style="font-size: 26px; font-weight: 700; color: #1e293b; margin-top: 8px;">${product.name}</h1>
                <div style="font-size: 24px; font-weight: 700; color: #dc2626; margin: 10px 0;">${formatPrice(product.price)}</div>
                
                <div style="font-size: 13px; color: #b91c1c; font-weight: 700; margin-bottom: 12px;">🔥 Số lượng tồn kho: còn ${product.stock} sản phẩm</div>

                ${specsHtml}
                ${featuresHtml}

                <div style="margin-bottom: 20px;">
                    <h3 style="font-size: 15px; font-weight: 700; color: #1e293b; margin-bottom: 6px;">📖 Mô tả chi tiết:</h3>
                    <p style="font-size: 13px; color: #475569; line-height: 1.6; margin: 0;">
                        ${product.detailedDescription || product.shortDescription}
                    </p>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button class="btn" type="button" onclick="addToCart(${product.id})" style="background: #fbbf24; color: #111827; font-weight: 600; padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer;">🛒 Thêm vào giỏ hàng</button>
                    <a href="index.html" class="btn" style="background: #64748b; color: #fff; font-weight: 600; padding: 10px 20px; border-radius: 6px; text-decoration: none; display: inline-block; text-align: center;">Quay lại</a>
                </div>
            </div>
          `;
        }
      });

      function handleSearch() {
        const kw = document.getElementById("search-keyword").value.trim();
        if (kw) window.location.href = `products.html?search=${encodeURIComponent(kw)}`;
      }
    </script>
  </body>
</html>
