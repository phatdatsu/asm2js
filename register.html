<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopDienTu - Đăng ký tài khoản</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      body.register-bg {
        background: radial-gradient(circle at top left, #1e293b, #0f172a);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
      }
      .register-container {
        width: 100%;
        max-width: 440px;
        padding: 20px;
      }
      .register-box {
        background: #ffffff;
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
        border: 1px solid #e2e8f0;
      }
      .register-header {
        text-align: center;
        margin-bottom: 25px;
      }
      .register-header h2 {
        font-size: 26px;
        font-weight: 900;
        color: #0f172a;
        margin-bottom: 8px;
      }
      .register-header p {
        font-size: 14px;
        color: #64748b;
      }
      .input-group {
        margin-bottom: 16px;
      }
      .input-group label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        color: #334155;
        margin-bottom: 6px;
      }
      .input-group input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        font-size: 14px;
        outline: none;
        background: #f8fafc;
        transition: all 0.2s;
      }
      .input-group input:focus {
        border-color: #ff6b00;
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(255, 107, 0, 0.1);
      }
      .btn-register {
        width: 100%;
        padding: 14px;
        background: #16a34a;
        color: #ffffff;
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 10px;
        box-shadow: 0 8px 20px rgba(22, 163, 74, 0.3);
      }
      .btn-register:hover {
        background: #15803d;
      }
      .register-footer {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: #64748b;
      }
      .register-footer a {
        color: #ff6b00;
        font-weight: 700;
        text-decoration: none;
      }
      .register-footer a:hover {
        text-decoration: underline;
      }
      .back-home {
        display: block;
        text-align: center;
        margin-top: 14px;
        font-size: 13px;
        color: #94a3b8;
        text-decoration: none;
      }
      .back-home:hover {
        color: #0f172a;
      }
    </style>
  </head>
  <body class="register-bg">
    <div class="register-container">
      <div class="register-box">
        <div class="register-header">
          <h2>Tạo Tài Khoản</h2>
          <p>Đăng ký thành viên ShopDienTu ngay hôm nay</p>
        </div>

        <form onsubmit="handleRegister(event)">
          <div class="input-group">
            <label>Họ và tên</label>
            <input type="text" id="reg-fullname" required placeholder="Nhập họ tên của bạn..." />
          </div>
          <div class="input-group">
            <label>Tên đăng nhập</label>
            <input type="text" id="reg-username" required placeholder="Chọn tên tài khoản..." />
          </div>
          <div class="input-group">
            <label>Địa chỉ Email</label>
            <input type="email" id="reg-email" required placeholder="name@example.com" />
          </div>
          <div class="input-group">
            <label>Mật khẩu</label>
            <input type="password" id="reg-password" required placeholder="••••••••" />
          </div>
          <button type="submit" class="btn-register">Đăng Ký Tài Khoản</button>
        </form>

        <div class="register-footer">Đã có tài khoản? <a href="login.html">Đăng nhập</a></div>
        <a href="index.html" class="back-home">← Quay lại trang chủ</a>
      </div>
    </div>

    <script>
      function handleRegister(e) {
        e.preventDefault();
        const fullname = document.getElementById("reg-fullname").value.trim();
        const username = document.getElementById("reg-username").value.trim();

        localStorage.setItem("cofe_fullname", fullname);
        localStorage.setItem("cofe_username", username);

        alert("Đăng ký tài khoản thành công!");
        window.location.href = "login.html";
      }
    </script>
  </body>
</html>
