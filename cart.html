<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopDienTu - Giỏ hàng</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="shop-header">
      <a href="index.html" class="shop-logo">DATSU Store</a>
      <div class="shop-user-actions" id="user-actions-container"></div>
    </header>

    <nav class="shop-subnav">
      <div class="shop-subnav-inner">
        <a href="index.html">Trang chủ</a>
        <a href="products.html">Sản phẩm</a>
        <a href="contact.html">Liên hệ</a>
        <a href="about.html">Giới thiệu</a>
      </div>
    </nav>

    <main class="container" style="padding: 30px 24px; flex: 1">
      <h1 style="font-size: 24px; font-weight: 700; margin-bottom: 20px">🛒 Giỏ hàng của bạn</h1>
      <div class="cart-layout">
        <div class="cart-items" id="cart-items-box"></div>
        <div class="cart-summary-box">
          <h3
            style="
              margin-bottom: 16px;
              font-size: 18px;
              border-bottom: 1px solid #f1f5f9;
              padding-bottom: 10px;
            "
          >
            Tóm tắt đơn hàng
          </h3>
          <div
            style="
              display: flex;
              justify-content: space-between;
              margin-bottom: 10px;
              font-size: 14px;
            "
          >
            <span>Tạm tính</span><strong id="summary-subtotal">0 đ</strong>
          </div>
          <div
            style="
              display: flex;
              justify-content: space-between;
              margin-bottom: 10px;
              font-size: 14px;
            "
          >
            <span>Phí giao hàng</span><strong>25.000 đ</strong>
          </div>
          <div
            style="
              display: flex;
              justify-content: space-between;
              margin-bottom: 20px;
              font-size: 16px;
              border-top: 1px solid #f1f5f9;
              padding-top: 12px;
            "
          >
            <span>Tổng cộng</span
            ><strong id="summary-total" style="color: #dc2626; font-size: 18px">0 đ</strong>
          </div>
          <!-- Nút tiến hành thanh toán -->
          <button
            onclick="checkLoginAndCheckout()"
            class="btn"
            style="
              width: 100%;
              text-align: center;
              background: #16a34a;
              padding: 12px;
              font-size: 15px;
              border: none;
              border-radius: 6px;
              color: #fff;
              cursor: pointer;
            "
          >
            Tiến hành thanh toán →
          </button>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container"><p>© 2026 ShopDienTu - DATSU - FPT Polytechnic</p></div>
    </footer>

    <script src="../js/app.js"></script>
    <script>
      // Kiểm tra đăng nhập trước khi cho phép bấm thanh toán
      function checkLoginAndCheckout() {
        const isLoggedIn = localStorage.getItem("cofe_isLoggedIn") === "true";
        if (!isLoggedIn) {
          alert("Vui lòng đăng nhập tài khoản để có thể tiến hành đặt hàng và thanh toán!");
          window.location.href = "login.html";
        } else {
          window.location.href = "checkout.html";
        }
      }

      function renderCartPage() {
        const container = document.getElementById("cart-items-box");
        if (!container) return;
        if (cart.length === 0) {
          container.innerHTML = `<p style="padding: 30px; text-align: center; color: #64748b;">Giỏ hàng của bạn đang trống.</p>`;
          document.getElementById("summary-subtotal").textContent = "0 đ";
          document.getElementById("summary-total").textContent = "25.000 đ";
          return;
        }

        container.innerHTML = cart
          .map(
            (item) => `
          <div class="cart-row">
            <img src="../${item.image}" alt="${item.name}" />
            <div style="flex:1;">
              <h3 style="font-size:15px; font-weight:700; color:#0f172a;">${item.name}</h3>
              <p style="color:#64748b; font-size:13px; margin-top:4px;">${formatPrice(item.price)} / sản phẩm</p>
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
              <button onclick="changeQty(${item.id}, -1)" style="width:28px; height:28px; border:1px solid #cbd5e1; background:#fff; border-radius:4px; cursor:pointer;">-</button>
              <span style="width:30px; text-align:center; font-weight:600;">${item.quantity}</span>
              <button onclick="changeQty(${item.id}, 1)" style="width:28px; height:28px; border:1px solid #cbd5e1; background:#fff; border-radius:4px; cursor:pointer;">+</button>
            </div>
            <div style="font-weight:700; color:#dc2626; font-size:16px; min-width:110px; text-align:right;">${formatPrice(item.price * item.quantity)}</div>
            <button onclick="removeItem(${item.id})" style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:18px; padding:6px;" title="Xóa">🗑️</button>
          </div>
        `,
          )
          .join("");

        const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
        document.getElementById("summary-subtotal").textContent = formatPrice(subtotal);
        document.getElementById("summary-total").textContent = formatPrice(subtotal + 25000);
      }

      window.changeQty = function (id, delta) {
        const item = cart.find((i) => i.id === id);
        if (item) {
          item.quantity += delta;
          if (item.quantity <= 0) {
            cart = cart.filter((i) => i.id !== id);
          }
          saveCart();
          renderCartPage();
        }
      };

      window.removeItem = function (id) {
        cart = cart.filter((item) => item.id !== id);
        saveCart();
        renderCartPage();
      };

      document.addEventListener("DOMContentLoaded", renderCartPage);
    </script>
  </body>
</html>
