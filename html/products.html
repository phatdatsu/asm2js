<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DATSU Store - Sản phẩm</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header class="shop-header">
      <a href="../index.html" class="shop-logo">DATSU Store</a>
      <div class="shop-search">
        <input
          type="text"
          id="filter-search"
          placeholder="Tìm kiếm sản phẩm..."
          oninput="applyFilters()"
        />
        <button type="button">🔍</button>
      </div>
      <div class="shop-user-actions" id="user-actions-container"></div>
    </header>

    <nav class="shop-subnav">
      <div class="shop-subnav-inner">
        <a href="../index.html">Trang chủ</a>
        <a href="products.html" class="active">Sản phẩm</a>
        <a href="contact.html">Liên hệ</a>
        <a href="about.html">Giới thiệu</a>
      </div>
    </nav>

    <main class="container" style="padding: 30px 24px; flex: 1">
      <div class="shop-layout">
        <aside class="filter-sidebar">
          <h3>🔍 Bộ lọc tìm kiếm</h3>
          <div style="margin-bottom: 16px">
            <label
              style="
                display: block;
                font-size: 13px;
                font-weight: 600;
                margin-bottom: 6px;
                color: #334155;
              "
              >Tên sản phẩm</label
            >
            <input
              type="text"
              id="sidebar-search"
              class="filter-input"
              placeholder="Nhập tên sản phẩm..."
              oninput="applyFilters()"
            />
          </div>
          <div style="margin-bottom: 16px">
            <label
              style="
                display: block;
                font-size: 13px;
                font-weight: 600;
                margin-bottom: 8px;
                color: #334155;
              "
              >Danh mục</label
            >
            <div
              style="
                display: flex;
                flex-direction: column;
                gap: 6px;
                font-size: 13px;
                color: #475569;
              "
            >
              <label style="cursor: pointer"
                ><input
                  type="radio"
                  name="category"
                  value="all"
                  checked
                  onchange="applyFilters()"
                />
                Tất cả</label
              >
              <label style="cursor: pointer"
                ><input type="radio" name="category" value="Laptop" onchange="applyFilters()" />
                Laptop</label
              >
              <label style="cursor: pointer"
                ><input type="radio" name="category" value="Điện thoại" onchange="applyFilters()" />
                Điện thoại</label
              >
              <label style="cursor: pointer"
                ><input type="radio" name="category" value="Tai nghe" onchange="applyFilters()" />
                Tai nghe</label
              >
              <label style="cursor: pointer"
                ><input type="radio" name="category" value="Chuột" onchange="applyFilters()" />
                Chuột</label
              >
            </div>
          </div>
          <div style="margin-bottom: 20px">
            <label
              style="
                display: block;
                font-size: 13px;
                font-weight: 600;
                margin-bottom: 8px;
                color: #334155;
              "
              >Mức giá</label
            >
            <div
              style="
                display: flex;
                flex-direction: column;
                gap: 6px;
                font-size: 13px;
                color: #475569;
              "
            >
              <label style="cursor: pointer"
                ><input
                  type="radio"
                  name="priceRange"
                  value="all"
                  checked
                  onchange="applyFilters()"
                />
                Tất cả mức giá</label
              >
              <label style="cursor: pointer"
                ><input type="radio" name="priceRange" value="under2m" onchange="applyFilters()" />
                Dưới 2 triệu</label
              >
              <label style="cursor: pointer"
                ><input type="radio" name="priceRange" value="2to5m" onchange="applyFilters()" /> Từ
                2 triệu đến 5 triệu</label
              >
              <label style="cursor: pointer"
                ><input type="radio" name="priceRange" value="5to15m" onchange="applyFilters()" />
                Từ 5 triệu đến 15 triệu</label
              >
              <label style="cursor: pointer"
                ><input type="radio" name="priceRange" value="over15m" onchange="applyFilters()" />
                Trên 15 triệu</label
              >
            </div>
          </div>
          <button
            class="btn"
            onclick="resetFilters()"
            style="width: 100%; background: #64748b; font-size: 13px; padding: 8px"
          >
            Đặt lại bộ lọc
          </button>
        </aside>

        <section>
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 20px;
              flex-wrap: wrap;
              gap: 10px;
            "
          >
            <div>
              <h1 style="font-size: 22px; color: #0f172a; font-weight: 700">Sản phẩm</h1>
              <p id="product-count" style="font-size: 13px; color: #64748b">Hiển thị 30 sản phẩm</p>
            </div>
            <div>
              <select
                id="sort-select"
                onchange="applyFilters()"
                style="
                  padding: 8px 12px;
                  border: 1px solid #cbd5e1;
                  border-radius: 6px;
                  outline: none;
                  background: #fff;
                  font-size: 13px;
                "
              >
                <option value="default">Sắp xếp: Mặc định</option>
                <option value="asc">Giá: Thấp đến cao</option>
                <option value="desc">Giá: Cao đến thấp</option>
              </select>
            </div>
          </div>
          <div id="product-catalog-grid" class="product-grid"></div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container"><p>© 2026 ShopDienTu - DATSU - FPT Polytechnic</p></div>
    </footer>

    <script src="../js/app.js"></script>
    <script>
      function renderCatalog(list) {
        const grid = document.getElementById("product-catalog-grid");
        document.getElementById("product-count").textContent = `Hiển thị ${list.length} sản phẩm`;
        if (!grid) return;
        if (list.length === 0) {
          grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 40px;">Không tìm thấy sản phẩm phù hợp.</p>`;
          return;
        }
        grid.innerHTML = list
          .map(
            (p) => `
          <div class="product-card">
              <img src="../${p.image}" alt="${p.name}" />
              <div class="product-info">
                  <h3>${p.name}</h3>
                  <p>${p.shortDescription || ""}</p>
                  <div class="price">
                      ${p.oldPrice ? `<span class="old-price">${formatPrice(p.oldPrice)}</span>` : ""}
                      <span class="sale-price">${formatPrice(p.price)}</span>
                  </div>
                  <div style="font-size: 11px; color: #b91c1c; font-weight: 700; margin-bottom: 8px;">🔥 Tồn kho: còn ${p.stock} sản phẩm</div>
                  <div class="card-actions">
                      <a href="detail.html?id=${p.id}" class="btn" style="flex:1; background:#fff; color:#2563eb; border:1px solid #cbd5e1; text-align:center;">Chi tiết</a>
                      <button class="btn" type="button" onclick="addToCart(${p.id})" style="flex:1; background:#fbbf24; color:#111827;">🛒 Thêm vào giỏ</button>
                  </div>
              </div>
          </div>
        `,
          )
          .join("");
      }

      function applyFilters() {
        const keyword = document.getElementById("sidebar-search").value.toLowerCase().trim();
        const cat = document.querySelector('input[name="category"]:checked').value;
        const priceRange = document.querySelector('input[name="priceRange"]:checked').value;
        const sort = document.getElementById("sort-select").value;

        let result = [...products];
        if (cat !== "all")
          result = result.filter((p) => p.category.toLowerCase() === cat.toLowerCase());

        if (priceRange === "under2m") result = result.filter((p) => p.price < 2000000);
        else if (priceRange === "2to5m")
          result = result.filter((p) => p.price >= 2000000 && p.price <= 5000000);
        else if (priceRange === "5to15m")
          result = result.filter((p) => p.price > 5000000 && p.price <= 15000000);
        else if (priceRange === "over15m") result = result.filter((p) => p.price > 15000000);

        if (keyword) result = result.filter((p) => p.name.toLowerCase().includes(keyword));

        if (sort === "asc") result.sort((a, b) => a.price - b.price);
        else if (sort === "desc") result.sort((a, b) => b.price - a.price);

        renderCatalog(result);
      }

      function resetFilters() {
        document.getElementById("sidebar-search").value = "";
        document.querySelector('input[name="category"][value="all"]').checked = true;
        document.querySelector('input[name="priceRange"][value="all"]').checked = true;
        document.getElementById("sort-select").value = "default";
        renderCatalog(products);
      }

      document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const sq = urlParams.get("search");
        if (sq) document.getElementById("sidebar-search").value = sq;
        renderCatalog(products);
      });
    </script>
  </body>
</html>
